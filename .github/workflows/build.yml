name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  tests:
    name: Scan regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check counting and scan decisions
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror tests/scan_math.cpp -o scan-tests
          ./scan-tests
          python3 tests/check_settings.py

  build:
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest
            target: win

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: true
          target: ${{ matrix.config.target }}

  package:
    name: Package builds
    runs-on: windows-latest
    needs: ['build']

    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
      - uses: actions/upload-artifact@v4
        with:
          name: Build Output
          path: ${{ steps.build.outputs.build-output }}
